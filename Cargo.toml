[package]
name = "tgbot-stock"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
encoding_rs = "0.8"
memmap2 = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "signal"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
